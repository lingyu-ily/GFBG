services:
  tabletop:
    build: .
    image: tablefolk:local
    container_name: tablefolk
    restart: unless-stopped
    init: true
    env_file: ${BGS_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
